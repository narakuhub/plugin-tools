name: NARS' ENDEAVOR LOG

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Username"
        required: true
      displayname:
        description: "Display Name"
        required: true
      userid:
        description: "User ID"
        required: true
      placeid:
        description: "Place ID"
        required: true
        default: "10959918411"
      verified_at:
        description: "Verified At"
        required: true
      total_requests:
        description: "Total Requests"
        required: true
        default: "1"

jobs:
  send-log:
    runs-on: ubuntu-latest

    steps:
      - name: Send Plugin Verification Log
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          USERNAME: ${{ inputs.username }}
          DISPLAYNAME: ${{ inputs.displayname }}
          USERID: ${{ inputs.userid }}
          PLACEID: ${{ inputs.placeid }}
          VERIFIED_AT: ${{ inputs.verified_at }}
          TOTAL_REQUESTS: ${{ inputs.total_requests }}

          VERIFY_URL: "https://raw.githubusercontent.com/narakuhub/plugin-tools/refs/heads/main/verify.lua"

          IMAGE_URL: "https://imgbs.com/uploads/1000270821-0cb973a0.png"

        run: |
          jq -n \
            --arg username "$USERNAME" \
            --arg displayname "$DISPLAYNAME" \
            --arg userid "$USERID" \
            --arg placeid "$PLACEID" \
            --arg verified "$VERIFIED_AT" \
            --arg total "$TOTAL_REQUESTS" \
            --arg verify "$VERIFY_URL" \
            --arg image "$IMAGE_URL" \
            '{
              username: "NARAKU LOG",

              embeds: [
                {
                  title: "LOG PLUGIN NARAKU",

                  description:
                    ("**PROFIL**\n" +
                    "||" + $displayname + "||\n" +
                    "||@" + $username + "||\n" +
                    "||" + $userid + "||\n\n" +

                    "**Environment**\n" +
                    "Map        : Studio Ringan\n" +
                    "PlaceID    : " + $placeid + "\n\n" +

                    "**Verification**\n" +
                    "Status     : VERIFIED\n" +
                    "VerifiedAt : " + $verified + "\n\n" +

                    "**System Stats**\n" +
                    "Total Requests : " + $total),

                  color: 0,

                  thumbnail: {
                    url: $image
                  },

                  footer: {
                    text: "Execution Plugin Engine"
                  },

                  timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
                }
              ],

              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 5,
                      label: "EXECUTE",
                      url: $verify
                    }
                  ]
                }
              ]
            }' > payload.json

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "$WEBHOOK"
